<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>RésaCrous</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            --brand-color: #ff7b82;
            --brand-color-dark: #e85f68;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            background: #fff;
        }

        .site-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 32px;
            min-height: 88px;
            padding: 12px clamp(20px, 5vw, 72px);
            border-bottom: 1px solid #f0eeee;
        }

        .site-logo {
            display: block;
            width: 64px;
            height: 64px;
            object-fit: cover;
        }

        .site-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .site-nav a,
        .login-link {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border: 2px solid var(--brand-color);
            border-radius: 999px;
            color: #333;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: background-color 160ms ease, color 160ms ease;
        }

        .login-link {
            justify-self: end;
        }

        .site-nav a:hover,
        .site-nav a:focus-visible,
        .login-link:hover,
        .login-link:focus-visible {
            background: var(--brand-color);
            color: #fff;
        }

        .site-nav a:focus-visible,
        .login-link:focus-visible {
            outline: 3px solid var(--brand-color-dark);
            outline-offset: 3px;
        }

        .carousel {
            position: relative;
            width: min(100% - 40px, 1200px);
            margin: 32px auto;
        }

        .carousel-viewport {
            overflow: hidden;
            border-radius: 20px;
            background: #fff1f1;
        }

        .carousel-track {
            display: flex;
            transition: transform 500ms ease;
        }

        .carousel-slide {
            min-width: 100%;
        }

        .carousel-slide img {
            display: block;
            width: 100%;
            aspect-ratio: 14 / 6;
            object-fit: cover;
        }

        .carousel-control {
            position: absolute;
            top: 50%;
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            transform: translateY(-50%);
            border: 0;
            border-radius: 50%;
            background: #fff;
            color: #333;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 2px 12px rgb(0 0 0 / 18%);
        }

        .carousel-control:focus-visible,
        .carousel-dot:focus-visible {
            outline: 3px solid var(--brand-color-dark);
            outline-offset: 3px;
        }

        .carousel-control--previous {
            left: 16px;
        }

        .carousel-control--next {
            right: 16px;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 16px 0 0;
        }

        .carousel-dot {
            width: 10px;
            height: 10px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: #d7d0d0;
            cursor: pointer;
        }

        .carousel-dot[aria-current="true"] {
            background: var(--brand-color-dark);
        }

        @media (prefers-reduced-motion: reduce) {
            .carousel-track {
                transition: none;
            }
        }

        @media (max-width: 640px) {
            .site-header {
                grid-template-columns: 1fr auto;
                gap: 16px;
                padding: 16px;
            }

            .site-logo {
                width: 52px;
                height: 52px;
            }

            .site-nav {
                grid-column: 1 / -1;
                grid-row: 2;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .site-nav a,
            .login-link {
                min-height: 40px;
                padding: 0 12px;
                font-size: 14px;
            }

            .carousel {
                width: min(100% - 24px, 1200px);
                margin: 20px auto;
            }

            .carousel-viewport {
                border-radius: 12px;
            }

            .carousel-slide img {
                aspect-ratio: 4 / 3;
            }

            .carousel-control {
                width: 36px;
                height: 36px;
            }

            .carousel-control--previous {
                left: 10px;
            }

            .carousel-control--next {
                right: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <img class="site-logo" src="Projet ResaCrous/logoRésaCrous.png" alt="RésaCrous">
        <nav class="site-nav" aria-label="Navigation principale">
            <a href="ResaCrous - Produits.html">Nos produits</a>
            <a href="ResaCrous - Questions.html">Les Crous' Questions</a>
        </nav>
        <a class="login-link" href="ResaCrous - Connexion.html">Se connecter</a>
    </header>
    <main>
        <section class="carousel" aria-label="Galerie d'images">
            <div class="carousel-viewport">
                <div class="carousel-track" aria-live="polite">
                    <div class="carousel-slide" role="group" aria-roledescription="diapositive" aria-label="1 sur 3">
                        <img src="Projet ResaCrous/Menu Trio.png" alt="Image qui donne envie 1">
                    </div>
                    <div class="carousel-slide" role="group" aria-roledescription="diapositive" aria-label="2 sur 3">
                        <img src="Projet ResaCrous/Chaud.png" alt="Image qui donne envie 2">
                    </div>
                    <div class="carousel-slide" role="group" aria-roledescription="diapositive" aria-label="3 sur 3">
                        <img src="Projet ResaCrous/Dessert.png" alt="Image qui donne envie 3">
                    </div>
                </div>
            </div>
            <button class="carousel-control carousel-control--previous" type="button" aria-label="Image précédente">‹</button>
            <button class="carousel-control carousel-control--next" type="button" aria-label="Image suivante">›</button>
            <div class="carousel-dots" aria-label="Choisir une image">
                <button class="carousel-dot" type="button" aria-label="Afficher l'image 1" aria-current="true"></button>
                <button class="carousel-dot" type="button" aria-label="Afficher l'image 2" aria-current="false"></button>
                <button class="carousel-dot" type="button" aria-label="Afficher l'image 3" aria-current="false"></button>
            </div>
        </section>
    </main>
    <script>
        const track = document.querySelector(".carousel-track");
        const slides = Array.from(document.querySelectorAll(".carousel-slide"));
        const dots = Array.from(document.querySelectorAll(".carousel-dot"));
        const carousel = document.querySelector(".carousel");
        let currentSlide = 0;
        let autoAdvance;

        function showSlide(index) {
            currentSlide = (index + slides.length) % slides.length;
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach((dot, dotIndex) => {
                dot.setAttribute("aria-current", String(dotIndex === currentSlide));
            });
        }

        function startAutoAdvance() {
            window.clearInterval(autoAdvance);
            if (!document.hidden) {
                autoAdvance = window.setInterval(() => showSlide(currentSlide + 1), 3000);
            }
        }

        document.querySelector(".carousel-control--previous").addEventListener("click", () => {
            showSlide(currentSlide - 1);
        });
        document.querySelector(".carousel-control--next").addEventListener("click", () => {
            showSlide(currentSlide + 1);
        });
        dots.forEach((dot, index) => {
            dot.addEventListener("click", () => showSlide(index));
        });
        carousel.addEventListener("mouseenter", () => window.clearInterval(autoAdvance));
        carousel.addEventListener("mouseleave", startAutoAdvance);
        carousel.addEventListener("focusin", () => window.clearInterval(autoAdvance));
        carousel.addEventListener("focusout", (event) => {
            if (!carousel.contains(event.relatedTarget)) startAutoAdvance();
        });
        document.addEventListener("visibilitychange", startAutoAdvance);
        startAutoAdvance();
    </script>
</body>
</html>
